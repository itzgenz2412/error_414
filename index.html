<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LPay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif}
    img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;display:none}
    .show{display:block}
    #maintenance{display:none;position:fixed;inset:0;background:#0a0a0b;color:#fff;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:10}
    .m-card{width:100%;max-width:360px;background:#18181a;border:1px solid #242426;border-radius:28px;padding:32px 24px;text-align:center}
    .m-icon{width:64px;height:64px;background:#1e1e20;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:30px}
    .m-card h2{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-bottom:10px}
    .m-card .desc{font-size:14px;color:#9a9aa0;line-height:1.6;margin-bottom:6px}
    .m-card .small{font-size:12px;color:#5a5a60;margin-bottom:26px;margin-top:12px}
    .copy-btn{width:100%;height:52px;background:#fff;color:#000;border:0;border-radius:16px;font-weight:800;font-size:14px;cursor:pointer;transition:.15s}
    .copy-btn:active{transform:scale(.97)}
    #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:11px 18px;border-radius:100px;font-size:13px;font-weight:700;display:none;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.4)}
    #toast.show{display:block}
  </style>
</head>
<body>

<script>const MAINTENANCE_MODE = "OFF";</script>

<div id="normalSite">
  <img src="./img1.jpg" class="show" id="first" alt="">
  <img src="./img2.jpg" id="second" alt="">
</div>

<div id="maintenance">
  <div class="m-card">
    <div class="m-icon">◍</div>
    <h2>Service Unavailable</h2>
    <p class="desc">This application subscription has expired. Access has been temporarily restricted by the developer.</p>
    <p class="small">To restore access, please contact support with your license ID.</p>
    <button class="copy-btn" onclick="copyNumber()">Contact on WhatsApp</button>
  </div>
</div>

<div id="toast">Copied to clipboard</div>

<script>
function copyNumber(){
  const num="09156089041";
  navigator.clipboard.writeText(num).then(showToast).catch(()=>{
    let t=document.createElement('textarea');t.value=num;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);showToast();
  });
}
function showToast(){
  const el=document.getElementById('toast');
  el.textContent="09156089041 copied - Contact on WhatsApp";
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}
if(MAINTENANCE_MODE==="ON"){
  document.getElementById("normalSite").style.display="none";
  document.getElementById("maintenance").style.display="flex";
}else{
  const authClient=window.supabase.createClient("https://dfsxybkcgutpodyfacls.supabase.co","sb_publishable_nsJMqh1tDkQ4DjAUDnp7MA_6BOsGa41",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  setTimeout(()=>{document.getElementById("first").classList.remove("show");document.getElementById("second").classList.add("show")},4000);
  setTimeout(async()=>{try{const {data}=await authClient.auth.getSession();window.location.replace(data.session?"./dashboard.html":"./login.html");}catch(e){window.location.replace("./login.html");}},8000);
}
</script>
</body>
</html>
