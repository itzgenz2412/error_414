<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transfer to Bank Account</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
body{background:#121212;color:white;margin:0;padding:0}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#1e1e1e}
.user-row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#121212}
.avatar{width:44px;height:44px;border-radius:50%;background:white;overflow:hidden;display:flex;align-items:center;justify-content:center;border:2px solid #2a2a2a}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-fb{width:44px;height:44px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;font-weight:800;color:#000;overflow:hidden}
.user-name{font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0.2px}
.user-sub{color:#8a8a8a;font-size:12px;margin-top:3px}

/* CARD - MATCH SCREENSHOT */
.card{background:#1e1e1e;margin:10px 12px;border-radius:12px;padding:14px 14px 14px 14px;position:relative}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-title{font-weight:600;font-size:14px;color:#e5e5e5}
.fee-badge{background:rgba(0,214,143,0.12);color:#00d68f;font-size:10px;font-weight:600;padding:4px 8px;border-radius:6px}

/* AMOUNT FIELD LIKE IMAGE */
.amount-field{display:flex;align-items:center;gap:8px;border-bottom:1px solid #2a2a2a;padding:4px 0 12px 0}
.amount-field b{font-size:22px;font-weight:800;color:white}
.amount-field input{background:transparent;border:none;color:#888;width:100%;font-size:20px;font-weight:700;outline:none}
.amount-field input::placeholder{color:#6b6b6b;font-weight:700}

/* QUICK GRID LIKE IMAGE */
.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.quick-grid button{background:#2a2a2a;border:none;color:#d0d0d0;padding:14px 0;border-radius:10px;font-size:13px;font-weight:600}

/* REMARK */
.remark-input{background:transparent;border:none;border-bottom:1px solid #2a2a2a;width:100%;padding:10px 0;color:white;font-size:13px;outline:none;margin-top:2px}
.remark-input::placeholder{color:#6b6b6b}
.remark-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.remark-grid button{background:#2a2a2a;border:none;color:#d0d0d0;padding:13px;border-radius:10px;font-size:13px;font-weight:500}

.btn-next{width:100%;background:#12372f;color:#0a5c46;border:none;padding:16px;border-radius:30px;margin-top:16px;font-weight:800;font-size:14px;pointer-events:none;opacity:0.6}
.btn-next.enabled{background:#00d68f;color:#000;pointer-events:auto;opacity:1}

/* Bottom sheet */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:.30s;z-index:999}
.sheet-overlay.open{opacity:1;visibility:visible}
.sheet{position:fixed;left:0;right:0;bottom:0;height:50vh;min-height:330px;background:#1e1e1e;border-radius:22px 22px 0 0;transform:translateY(100%);transition:.30s;z-index:1000;overflow:hidden}
.sheet.open{transform:translateY(0)}
.handle{width:42px;height:5px;background:#555;border-radius:10px;margin:10px auto}
.sheet-close{position:absolute;right:15px;top:12px;width:32px;height:32px;border:0;border-radius:50%;background:#2a2a2a;color:#fff;font-size:20px;cursor:pointer}
#previewFrame{width:100%;height:calc(100% - 45px);border:0;display:block;background:#1e1e1e}
</style>
</head>
<body>

<div class="header">
  <div onclick="window.location.href='bank.html'" style="cursor:pointer;display:flex;align-items:center">
    <span style="color:white;margin-right:10px;font-size:20px"><</span><b style="font-size:14px;font-weight:600">Transfer to OPay Account</b>
  </div>
  <div style="color:#00d68f;font-size:13px;font-weight:600">Records</div>
</div>

<div class="user-row">
  <div id="iconWrap"><div class="avatar-fb">O</div></div>
  <div><div class="user-name" id="pName">Bank recipient</div><div class="user-sub" id="pSub">Account number</div></div>
</div>

<!-- AMOUNT CARD - SAME AS IMAGE -->
<div class="card">
  <div class="card-header">
    <div class="card-title">Amount</div>
    <div class="fee-badge">No Transaction Fees</div>
  </div>

  <div class="amount-field">
    <b>₦</b>
    <input id="amountInput" placeholder="10.00 - 5,000,000.00" inputmode="numeric">
  </div>

  <div class="quick-grid">
    <button onclick="setAmount(500)">₦500</button>
    <button onclick="setAmount(1000)">₦1,000</button>
    <button onclick="setAmount(2000)">₦2,000</button>
    <button onclick="setAmount(5000)">₦5,000</button>
    <button onclick="setAmount(10000)">₦10,000</button>
    <button onclick="setAmount(9999)">₦9,999</button>
  </div>
  <button class="btn-next" id="nextBtn">Continue</button>
</div>

<!-- REMARK CARD - SAME AS IMAGE -->
<div class="card">
  <div class="card-title">Remark</div>
  <input class="remark-input" placeholder="What's this for?(Optional)">
  <div class="remark-grid">
    <button>Purchase</button>
    <button>Personal</button>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="previewSheet">
  <div class="handle"></div>
  <button class="sheet-close" id="sheetClose">&times;</button>
  <iframe id="previewFrame" src="about:blank" title="Preview"></iframe>
</div>

<script>
const savedName = localStorage.getItem('transfer_name') || 'Bank recipient';
const savedBank = localStorage.getItem('transfer_bank') || '';
const savedAcc = localStorage.getItem('transfer_account') || '';
const savedCode = localStorage.getItem('transfer_bankCode') || '';

document.getElementById('pName').textContent = savedName;
document.getElementById('pSub').textContent = savedAcc + ' ' + savedBank.replace(' Digital Services Limited','').replace(' (OPay)','').trim() || savedAcc;

function normalizeBankName(v){return String(v||"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]/g,"");}
async function loadLogo(){
  const wrap = document.getElementById('iconWrap');
  try{
    const res = await fetch('https://cdn.jsdelivr.net/gh/Nigerian-Bank-Logos/ng-bank-logos@main/dist/banks_NGN.json');
    const data = await res.json();
    const banks = data.banks || data;
    const searchCode = String(savedCode||"").trim();
    const searchName = normalizeBankName(savedBank);
    let found = null;
    if(searchCode) found = banks.find(b=> String(b.bankCode||"") === searchCode);
    if(!found) found = banks.find(b=> normalizeBankName(b.name)===searchName || (Array.isArray(b.aliases)&&b.aliases.some(a=>normalizeBankName(a)===searchName)));
    if(!found) found = banks.find(b=>{const n=normalizeBankName(b.name);return n.includes(searchName)||searchName.includes(n);});
    if(found && found.logos && found.logos.png){
      wrap.innerHTML = `<div class="avatar"><img src="${found.logos.png}"></div>`;return;
    }
    const commons={"opay":"https://cdn.jsdelivr.net/gh/Nigerian-Bank-Logos/ng-bank-logos@main/logos/ngn/png/payment-companies/OPay.png","palmpay":"https://cdn.jsdelivr.net/gh/Nigerian-Bank-Logos/ng-bank-logos@main/logos/ngn/png/payment-companies/PalmPay.png"};
    for(const k in commons){if(searchName.includes(k)){wrap.innerHTML=`<div class="avatar"><img src="${commons[k]}"></div>`;return;}}
  }catch(e){}
  wrap.innerHTML=`<div class="avatar-fb"><img src="https://cdn.jsdelivr.net/gh/Nigerian-Bank-Logos/ng-bank-logos@main/logos/ngn/png/payment-companies/OPay.png"></div>`;
}
loadLogo();

const input = document.getElementById('amountInput');
const nextBtn = document.getElementById('nextBtn');
function check(){let v=parseFloat(input.value);if(!isNaN(v)&&v>=10)nextBtn.classList.add('enabled');else nextBtn.classList.remove('enabled');}
function setAmount(v){input.value=v;check();}
input.addEventListener('input',()=>{input.value=input.value.replace(/[^0-9]/g,'');check();});
const sheet=document.getElementById("previewSheet"),overlay=document.getElementById("sheetOverlay"),closeBtn=document.getElementById("sheetClose"),previewFrame=document.getElementById("previewFrame");
function openPreview(){localStorage.setItem('transfer_amount',input.value);previewFrame.src="print2.html";overlay.classList.add("open");sheet.classList.add("open");}
function closePreview(){sheet.classList.remove("open");overlay.classList.remove("open");setTimeout(()=>{previewFrame.src="about:blank";},300);}
closeBtn.addEventListener("click",closePreview);overlay.addEventListener("click",closePreview);
nextBtn.addEventListener("click",function(){if(!nextBtn.classList.contains('enabled'))return;openPreview();});
</script>
</body>
</html>
